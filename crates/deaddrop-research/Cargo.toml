[package]
name = "deaddrop-research"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "deaddrop-research"
path = "src/main.rs"

[dependencies]
deaddrop-klodik = { path = "../deaddrop-klodik" }
deaddrop-protocol = { path = "../deaddrop-protocol" }
deaddrop-shell = { path = "../deaddrop-shell" }
deaddrop-room = { path = "../deaddrop-room" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
deaddrop-github = { path = "../deaddrop-github" }
